name: VivaBem CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validacao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Verificar arquivos obrigatórios
        run: |
          test -f package.json
          test -f README.md
          test -f index.html
          test -f src/App.jsx

      - name: Verificar página Login
        run: grep -r "Viva Bem" src/pages/Login.jsx

      - name: Verificar Dashboard
        run: grep -r "Dashboard" src/pages/Dashboard.jsx

      - name: Verificar ProtectedRoute
        run: test -f src/components/ProtectedRoute.jsx

      - name: Verificar elemento root
        run: grep -q 'id="root"' index.html

      - name: Executar ESLint
        run: npm run lint

      - name: Gerar build
        run: npm run build